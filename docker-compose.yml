services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kitch
      POSTGRES_PASSWORD: kitch
      POSTGRES_DB: kitch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitch"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://kitch:kitch@db:5432/kitch?sslmode=disable
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
